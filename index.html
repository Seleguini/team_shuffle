<!-- Local-storage shim that mimics the window.storage API the app was
     originally written against, so the app code needs no changes.
     Data is saved only on THIS device/browser. -->
<script>
(function () {
  var PREFIX = "sorteio_de_times__";
  window.storage = {
    get: function (key) {
      try {
        var raw = localStorage.getItem(PREFIX + key);
        if (raw === null) return Promise.resolve(null);
        return Promise.resolve({ key: key, value: raw, shared: false });
      } catch (e) { return Promise.resolve(null); }
    },
    set: function (key, value) {
      try {
        localStorage.setItem(PREFIX + key, value);
        return Promise.resolve({ key: key, value: value, shared: false });
      } catch (e) { return Promise.resolve(null); }
    },
    delete: function (key) {
      try {
        localStorage.removeItem(PREFIX + key);
        return Promise.resolve({ key: key, deleted: true, shared: false });
      } catch (e) { return Promise.resolve(null); }
    },
    list: function (prefix) {
      try {
        var p = PREFIX + (prefix || "");
        var keys = Object.keys(localStorage)
          .filter(function (k) { return k.indexOf(p) === 0; })
          .map(function (k) { return k.slice(PREFIX.length); });
        return Promise.resolve({ keys: keys, prefix: prefix || "", shared: false });
      } catch (e) { return Promise.resolve(null); }
    }
  };
})();
</script>

<!-- Watchdog: if the app hasn't mounted after a few seconds, show exactly
     what's missing instead of leaving a silent "Carregando..." forever.
     This turns an invisible failure into an actionable message. -->
<script>
  window.addEventListener("error", function (e) {
    console.error("[sorteio] erro:", e.message || e);
  }, true);

  setTimeout(function () {
    var root = document.getElementById("root");
    if (!root || root.textContent.indexOf("Carregando") === -1) return; // já montou, tudo bem

    var missing = [];
    if (typeof React === "undefined") missing.push("React");
    if (typeof ReactDOM === "undefined") missing.push("ReactDOM");
    if (typeof Babel === "undefined") missing.push("Babel");

    var lines = [];
    lines.push("O app não conseguiu iniciar.");
    if (missing.length) {
      lines.push("Não carregou: " + missing.join(", ") + ".");
    } else {
      lines.push("As bibliotecas carregaram, mas o app não montou (veja o console do navegador para o erro exato).");
    }
    lines.push(navigator.onLine ? "Conexão: online." : "Conexão: OFFLINE — conecte à internet e recarregue.");
    lines.push("Se estiver online e continuar assim, tente abrir em outro navegador ou verifique se algum bloqueador de anúncios/firewall está travando cdn.jsdelivr.net.");

    root.innerHTML =
      '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:28px;color:#F2F6EF;font-family:sans-serif;font-size:13px;text-align:center;background:#0D1310;line-height:1.6;">' +
      '<div>' + lines.map(function(l){ return escapeHtml(l); }).join('<br/><br/>') + '</div>' +
      '</div>';
  }, 5000);

  function escapeHtml(s) {
    var d = document.createElement("div");
    d.textContent = s;
    return d.innerHTML;
  }
</script>

    return (
      <svg
        width={size}
        height={size}
        viewBox="0 0 24 24"
        fill="none"
        stroke={color || "currentColor"}
        strokeWidth={strokeWidth}
        strokeLinecap="round"
        strokeLinejoin="round"
        style={style}
        className={className}

        {children}

    );
  };
}

/* Splits pasted text by comma AND/OR line breaks, trims, drops empties,
   and separates out names that are duplicates (of each other or of the
   existing roster) so the UI can warn about them without silently losing input. */
function parseBulkNames(text, existingNames) {
  const raw = text
    .split(/[\n,]/)
    .map((s) => s.trim())
    .filter(Boolean);
  const seen = new Set();
  const toAdd = [];
  const duplicates = [];
  for (const name of raw) {
    const key = name.toLowerCase();
    if (seen.has(key) || existingNames.has(key)) {
      duplicates.push(name);
      continue;
    }
    seen.add(key);
    toAdd.push(name);
  }
  return { toAdd, duplicates };
}

/* ---------------------------------------------------------------
   STORAGE
---------------------------------------------------------------- */
async function loadKey(key, fallback) {
  try {
    const r = await window.storage.get(key, false);
    return r && r.value ? JSON.parse(r.value) : fallback;
  } catch (e) {
    return fallback;
  }
}
async function saveKey(key, value) {
  try {
    await window.storage.set(key, JSON.stringify(value), false);
  } catch (e) {
    /* silent */
  }
}

  return (

          onClick={readOnly ? undefined : () => onChange(n)}

            background: n <= value ? C.amber : "transparent",

}

/* ---------------------------------------------------------------
   PLAYERS SCREEN
---------------------------------------------------------------- */
function PlayersScreen({ players, setPlayers }) {
  const [query, setQuery] = useState("");
  const [newName, setNewName] = useState("");
  const [newPoints, setNewPoints] = useState(3);
  const [editingId, setEditingId] = useState(null);
  const [editName, setEditName] = useState("");
  const [editPoints, setEditPoints] = useState(3);
  const inputRef = useRef(null);

  const [bulkOpen, setBulkOpen] = useState(false);
  const [bulkText, setBulkText] = useState("");
  const [bulkPoints, setBulkPoints] = useState(3);

  const filtered = useMemo(
    () => players.filter((p) => p.name.toLowerCase().includes(query.toLowerCase())),
    [players, query]
  );

  const existingNames = useMemo(
    () => new Set(players.map((p) => p.name.toLowerCase())),
    [players]
  );
  const bulkParsed = useMemo(
    () => parseBulkNames(bulkText, existingNames),
    [bulkText, existingNames]
  );

  function closeBulk() {
    setBulkOpen(false);
    setBulkText("");
    setBulkPoints(3);
  }

  function confirmBulkAdd() {
    if (bulkParsed.toAdd.length === 0) return;
    const now = Date.now();
    const newPlayers = bulkParsed.toAdd.map((name, i) => ({
      id: uid(),
      name,
      points: bulkPoints,
      createdAt: now + i,
    }));
    setPlayers([...players, ...newPlayers]);
    closeBulk();
  }

  function addPlayer() {
    const name = newName.trim();
    if (!name) return;
    setPlayers([...players, { id: uid(), name, points: newPoints, createdAt: Date.now() }]);
    setNewName("");
    setNewPoints(3);
    inputRef.current?.focus();
  }

  function startEdit(p) {
    setEditingId(p.id);
    setEditName(p.name);
    setEditPoints(p.points);
  }

  function saveEdit(id) {
    const name = editName.trim();
    if (!name) return;
    setPlayers(players.map((p) => (p.id === id ? { ...p, name, points: editPoints } : p)));
    setEditingId(null);
  }

  function removePlayer(id) {
    setPlayers(players.filter((p) => p.id !== id));
  }

  return (
    <div className="flex flex-col" style={{ minHeight: "100%" }}>
      <TopBar
        title="Elenco"
        right={
          <div className="flex items-center gap-3">
            <button
              onClick={() => setBulkOpen(true)}
              style={{ color: C.lime }}
              className="p-1 -mr-1 flex items-center gap-1"
              aria-label="Adicionar em massa"
            >
              <ListPlus size={20} strokeWidth={2.2} />
            </button>
            <span style={{ ...body, color: C.muted, fontSize: 13 }}>
              {players.length} {players.length === 1 ? "atleta" : "atletas"}
            </span>
          </div>
        }
      />

      <div className="px-4 pt-3 pb-2">
        <div
          style={{ background: C.surface2, border: `1px solid ${C.border}` }}
          className="flex items-center gap-2 rounded-xl px-3 py-2.5"
        >
          <Search size={16} style={{ color: C.mutedDark }} />
          <input
            value={query}
            onChange={(e) => setQuery(e.target.value)}
            placeholder="Buscar atleta"
            style={{ ...body, color: C.text, background: "transparent" }}
            className="flex-1 outline-none text-sm placeholder:opacity-60"
          />
        </div>
        <button
          onClick={() => setBulkOpen(true)}
          className="flex items-center gap-1.5 mt-2.5 px-0.5"
        >
          <ListPlus size={14} style={{ color: C.lime }} />
          <span style={{ ...body, color: C.lime, fontWeight: 600 }} className="text-xs">
            Adicionar vários de uma vez
          </span>
        </button>
      </div>

      <div className="flex-1 px-4 pb-2 overflow-y-auto">
        {players.length === 0 ? (
          <EmptyState icon={Users} title="Elenco vazio" subtitle="Cadastre os atletas uma vez. Depois é só marcar quem apareceu em cada racha." />
        ) : filtered.length === 0 ? (
          <p style={{ ...body, color: C.muted }} className="text-sm text-center py-10">Nenhum atleta encontrado.</p>
        ) : (
          <div className="flex flex-col gap-2 pt-1">
            {filtered.map((p) => (
              <div
                key={p.id}
                style={{ background: C.surface, border: `1px solid ${C.border}` }}
                className="rounded-xl px-3.5 py-3"
              >
                {editingId === p.id ? (
                  <div className="flex flex-col gap-2.5">
                    <input
                      value={editName}
                      onChange={(e) => setEditName(e.target.value)}
                      style={{ ...body, color: C.text, background: C.surface2, border: `1px solid ${C.borderLight}` }}
                      className="rounded-lg px-3 py-2 text-sm outline-none"
                      autoFocus
                    />
                    <div className="flex items-center justify-between">
                      <div className="flex items-center gap-2">
                        <span style={{ ...body, color: C.muted, fontSize: 12 }}>Nível</span>
                        <Dots value={editPoints} onChange={setEditPoints} size={11} />
                      </div>
                      <div className="flex items-center gap-2">
                        <button onClick={() => setEditingId(null)} style={{ color: C.muted }} className="p-1.5">
                          <X size={16} />
                        </button>
                        <button
                          onClick={() => saveEdit(p.id)}
                          style={{ background: C.lime, color: "#0D1310" }}
                          className="rounded-lg px-3 py-1.5 flex items-center gap-1"
                        >
                          <Check size={14} strokeWidth={3} />
                          <span style={{ ...body, fontWeight: 700, fontSize: 12 }}>Salvar</span>
                        </button>
                      </div>
                    </div>
                  </div>
                ) : (
                  <div className="flex items-center justify-between">
                    <div className="flex flex-col gap-1.5 min-w-0">
                      <span style={{ ...body, color: C.text, fontWeight: 600 }} className="text-[15px] truncate">
                        {p.name}
                      </span>
                      <Dots value={p.points} readOnly size={7} />
                    </div>
                    <div className="flex items-center gap-1 shrink-0">
                      <button onClick={() => startEdit(p)} style={{ color: C.muted }} className="p-2">
                        <Pencil size={15} />
                      </button>
                      <button onClick={() => removePlayer(p.id)} style={{ color: C.danger }} className="p-2">
                        <Trash2 size={15} />
                      </button>
                    </div>
                  </div>
                )}

            ))}

        )}
      </div>

        style={{ background: C.surface, borderTop: `1px solid ${C.border}` }}

/* ---------------------------------------------------------------
   DRAW LOGIC
---------------------------------------------------------------- */
function shuffleArr(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function generateTeams(selectedPlayers, splitMode, teamSize, teamCount, balanced) {
  const n = selectedPlayers.length;
  let numTeams = splitMode === "count" ? teamCount : Math.max(1, Math.ceil(n / Math.max(1, teamSize)));
  numTeams = Math.max(1, Math.min(numTeams, n));
  const teams = Array.from({ length: numTeams }, () => []);
  let pool = shuffleArr(selectedPlayers);

  if (balanced) {
    pool = [...pool].sort((a, b) => b.points - a.points);
    let t = 0,
      dir = 1;
    for (const p of pool) {
      teams[t].push(p);
      t += dir;
      if (t === numTeams) {
        t = numTeams - 1;
        dir = -1;
      } else if (t < 0) {
        t = 0;
        dir = 1;
      }
    }
  } else {
    pool.forEach((p, i) => teams[i % numTeams].push(p));
  }
  return teams;
}

                          </p>
                        </div>
                      ))}
                      <button
                        onClick={() => remove(h.id)}
                        style={{ color: C.danger }}
                        className="self-start flex items-center gap-1.5 mt-1"
                      >
                        <Trash2 size={13} />
                        <span style={{ ...body, fontSize: 12 }}>Excluir</span>
                      </button>
                    </div>
                  )}
                </div>
              );
            })}
          </div>
        )}
      </div>
    </div>
  );
}

/* ---------------------------------------------------------------
   APP
---------------------------------------------------------------- */
function App() {
  const [loaded, setLoaded] = useState(false);
  const [players, setPlayers] = useState([]);
  const [history, setHistory] = useState([]);
  const [screen, setScreen] = useState("home"); // home | players | history | select | result
  const [setup, setSetup] = useState({
    sportId: "futsal",
    customSize: 5,
    splitMode: "size",
    teamCount: 2,
    balanced: false,
  });
  const [selected, setSelected] = useState(new Set());
  const [teams, setTeams] = useState([]);
  const [shuffling, setShuffling] = useState(false);
  const [saved, setSaved] = useState(false);

  // load fonts
  useEffect(() => {
    const link = document.createElement("link");
    link.rel = "stylesheet";
    link.href = "https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap";
    document.head.appendChild(link);
  }, []);

  // load storage
  useEffect(() => {
    (async () => {
      const p = await loadKey("players", []);
      const h = await loadKey("history", []);
      setPlayers(p);
      setHistory(h);
      setLoaded(true);
    })();
  }, []);

  useEffect(() => {
    if (loaded) saveKey("players", players);
  }, [players, loaded]);

  useEffect(() => {
    if (loaded) saveKey("history", history);
  }, [history, loaded]);

  const sport = SPORTS.find((s) => s.id === setup.sportId) || SPORTS[0];
  const effectiveSize = sport.id === "custom" ? setup.customSize : sport.size;

  function goSelect() {
    setSelected(new Set(players.map((p) => p.id)));
    setScreen("select");
  }

  function runDraw() {
    const chosen = players.filter((p) => selected.has(p.id));
    setScreen("result");
    setShuffling(true);
    setSaved(false);
    setTimeout(() => {
      setTeams(generateTeams(chosen, setup.splitMode, effectiveSize, setup.teamCount, setup.balanced));
      setShuffling(false);
    }, 650);
  }

  function reshuffle() {
    const chosen = players.filter((p) => selected.has(p.id));
    setShuffling(true);
    setSaved(false);
    setTimeout(() => {
      setTeams(generateTeams(chosen, setup.splitMode, effectiveSize, setup.teamCount, setup.balanced));
      setShuffling(false);
    }, 500);
  }

  function saveDraw() {
    setHistory([...history, { id: uid(), date: Date.now(), sportName: sport.name, teams }]);
    setSaved(true);
  }

  const chosenPlayers = players.filter((p) => selected.has(p.id));

  return (
    <div style={{ background: C.bg, minHeight: "100vh", ...body }} className="flex flex-col max-w-md mx-auto relative">
      <style>{`
        * { box-sizing: border-box; }
        input::placeholder { color: ${C.mutedDark}; }
        ::-webkit-scrollbar { width: 0px; }
        @keyframes spin { from { transform: rotate(0deg);} to { transform: rotate(360deg);} }
        .animate-spin { animation: spin 1s linear infinite; }
      `}</style>

      <div className="flex-1 flex flex-col" style={{ minHeight: "100vh" }}>
        {screen === "home" && (
          <HomeScreen players={players} setup={setup} setSetup={setSetup} goSelect={goSelect} />
        )}
        {screen === "players" && <PlayersScreen players={players} setPlayers={setPlayers} />}
        {screen === "history" && <HistoryScreen history={history} setHistory={setHistory} />}
        {screen === "select" && (
          <SelectScreen
            players={players}
            selected={selected}
            setSelected={setSelected}
            onBack={() => setScreen("home")}
            onConfirm={runDraw}
          />
        )}
        {screen === "result" && (
          <ResultScreen
            teams={teams}
            setTeams={setTeams}
            sportName={sport.name}
            selectedPlayers={chosenPlayers}
            splitMode={setup.splitMode}
            teamSize={effectiveSize}
            teamCount={setup.teamCount}
            balanced={setup.balanced}
            shuffling={shuffling}
            onBack={() => setScreen("select")}
            onReshuffle={reshuffle}
            onSave={saveDraw}
            saved={saved}
          />
        )}
      </div>

      {(screen === "home" || screen === "players" || screen === "history") && (
        <BottomNav screen={screen} setScreen={setScreen} />
      )}
    </div>
  );
}


const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
</body>
</html>
